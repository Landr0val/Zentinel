version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: zentinel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations/ -database postgres://postgres:postgres@db:5432/zentinel?sslmode=disable up
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
